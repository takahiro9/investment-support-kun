<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>investment-support-kun — Dashboard</title>
<link rel="stylesheet" href="app/app.css" />
</head>
<body>
<div id="root"></div>

<!-- React + Babel from CDN (buildless JSX, no npm install needed). -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Terminal emulator for the Claude Code sessions panel (app/claude.jsx). -->
<link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" crossorigin="anonymous" />
<script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js" crossorigin="anonymous"></script>

<!-- App sources (order matters: store → dashboard/claude → app). -->
<script type="text/babel" src="app/store.jsx"></script>
<script type="text/babel" src="app/claude.jsx"></script>
<script type="text/babel" src="app/dashboard.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
